<div class="login-page">

  <section class="brand-panel">

    <div class="brand-content">

      <h1>Pernocentro</h1>

      <p>SISTEMA AVANZADO DE INVENTARIO</p>

      <div class="line"></div>

      <div class="image-box">
        <img
          src="assets/Pernocentro.png"
          alt="Pernocentro"
        >
      </div>

    </div>

  </section>

  <section class="login-panel">

    <div class="login-card">

      <h2>Bienvenido</h2>

      <p class="subtitle">
        Inicia sesión para continuar
      </p>

      <form (ngSubmit)="ingresar()">

        <input
          type="text"
          name="usuario"
          placeholder="Usuario"
          [(ngModel)]="usuario"
          autocomplete="username"
        >

        <div class="password-group">

          <input
            [type]="mostrarPassword ? 'text' : 'password'"
            name="password"
            placeholder="Contraseña"
            [(ngModel)]="password"
            autocomplete="current-password"
          >

          <button
            type="button"
            class="toggle-password"
            (click)="alternarPassword()"
          >

            @if (mostrarPassword) {

              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24">

                <path
                  fill="#64748b"
                  d="M2 4.27L4.28 2L22 19.72L19.73 22l-3.02-3.02A11.36 11.36 0 0 1 12 20C7 20 2.73 16.89 1 12.5a12.25 12.25 0 0 1 4.16-5.36L2 4.27Zm7.53 7.53a2.5 2.5 0 0 0 3.17 3.17L9.53 11.8ZM12 5c5 0 9.27 3.11 11 7.5a12.4 12.4 0 0 1-3.07 4.37l-3.2-3.2A5 5 0 0 0 10.33 7.27L7.86 4.8A11.36 11.36 0 0 1 12 5Z"/>

              </svg>

            } @else {

              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24">

                <path
                  fill="#64748b"
                  d="M12 5C7 5 2.73 8.11 1 12.5C2.73 16.89 7 20 12 20S21.27 16.89 23 12.5C21.27 8.11 17 5 12 5Zm0 12a4.5 4.5 0 1 1 0-9a4.5 4.5 0 0 1 0 9Zm0-2.2a2.3 2.3 0 1 0 0-4.6a2.3 2.3 0 0 0 0 4.6Z"/>

              </svg>

            }

          </button>

        </div>

        <button
          class="login-button"
          type="submit"
          [disabled]="cargando">

          {{ cargando ? 'Ingresando...' : 'Ingresar' }}

        </button>

      </form>

      @if (mensajeError) {

        <p class="login-error">
          {{ mensajeError }}
        </p>

      }

      <div class="divider">

        <span></span>

        <p>
          Acceso autorizado únicamente
        </p>

        <span></span>

      </div>

      <div class="info-cards">

        <div>

          <strong>Seguro</strong>

          <p>Autenticación con Firebase</p>

        </div>

        <div>

          <strong>Roles</strong>

          <p>Acceso según permisos</p>

        </div>

      </div>

    </div>

  </section>

</div>
